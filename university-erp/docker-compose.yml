services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: university
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend-business:
    build: ./backend-business
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/university
      SPRING_REDIS_HOST: redis
    depends_on:
      - db
      - redis

  backend-ai:
    build: ./backend-ai-python
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/university
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  backend-router:
    build: ./backend-router
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      RUST_AUTH_URL: http://backend-security:8081
      SPRING_BUSINESS_URL: http://backend-business:8080
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: your-256-bit-secret
    depends_on:
      - backend-business
      - backend-security
      - redis

  backend-security:
    build: ./backend-security
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/university
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend-router

  chaos-engine:
    build: ./chaos-engine
    environment:
      REDIS_URL: redis://redis:6379/0
      GATEWAY_URL: http://backend-router:8000
      BUSINESS_URL: http://backend-business:8080
    depends_on:
      - redis
      - backend-router
      - backend-business
