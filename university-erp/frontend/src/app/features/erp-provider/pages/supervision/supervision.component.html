<div class="p-6">
  <h1 class="text-3xl font-bold mb-2">Supervision globale de l'ERP</h1>
  <p class="text-gray-600 dark:text-gray-400 mb-6">Carte d'architecture en temps réel. Gérez les attaques Chaos Engineering et observez les défenses.</p>

  <div class="flex gap-4 mb-6">
    <button (click)="toggleChaos('TEST')" [class.bg-blue-600]="chaosMode === 'TEST'" class="px-4 py-2 border rounded shadow hover:bg-gray-100 dark:hover:bg-gray-800">Mode TEST (Fuzzing modéré)</button>
    <button (click)="toggleChaos('PROD')" [class.bg-red-600]="chaosMode === 'PROD'" class="px-4 py-2 border border-red-500 rounded text-red-600 hover:bg-red-500 hover:text-white shadow font-bold">Mode PROD (Attaque massive)</button>
    <button (click)="toggleChaos('OFF')" [class.bg-gray-600]="chaosMode === 'OFF'" class="px-4 py-2 border rounded shadow hover:bg-gray-100 dark:hover:bg-gray-800">Désactiver le Chaos</button>
  </div>

  <div class="grid grid-cols-3 gap-6">
    
    <div class="col-span-2">
      <div class="p-4 border rounded-lg bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-800">
        <h2 class="font-bold text-lg mb-2 flex items-center gap-2">
          <span>Carte du Trafic en temps réel</span>
          <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full">En ligne</span>
        </h2>
        
        <div class="sys-map">
          <!-- Flow lines (CSS only simulation) -->
          <svg class="flow-lines">
            <line x1="190" y1="170" x2="300" y2="170" stroke="#475569" stroke-width="2" stroke-dasharray="5,5"/>
            <line x1="440" y1="160" x2="550" y2="80" stroke="#eab308" stroke-width="2" />
            <line x1="440" y1="180" x2="550" y2="280" stroke="#22c55e" stroke-width="2" />
            <line x1="690" y1="280" x2="800" y2="180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5"/>
            <line x1="690" y1="80" x2="800" y2="160" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5"/>
          </svg>

          <div *ngFor="let node of nodes" [class]="node.class" [style.left.px]="node.x" [style.top.px]="node.y">
            <span class="node-label">{{node.name}}</span>
          </div>
        </div>

        <div class="mt-4 flex gap-4 text-sm">
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500"></span> <span>Attaque</span></div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-yellow-500"></span> <span>Défense (Load Shedding/Ban)</span></div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-500"></span> <span>Trafic Stable & Caché</span></div>
        </div>
      </div>
    </div>

    <!-- Live Telemetry sidebar -->
    <div class="col-span-1">
      <div class="p-4 border rounded-lg bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-800 h-full">
        <h2 class="font-bold text-lg mb-4">Télémétrie & Evénements (Redis)</h2>
        <div class="text-xs font-mono flex flex-col gap-2">
          <div *ngFor="let ev of events" class="bg-gray-100 dark:bg-gray-800 p-2 rounded text-gray-800 dark:text-gray-300">
            {{ ev }}
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
